<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="记录药品有效期，查看临期和过期提醒">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>药品有效期管理</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172439;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}.wrap{max-width:920px;margin:auto;padding:28px 18px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}h1{font-size:clamp(23px,5vw,32px);margin:0 0 5px}h2{font-size:19px;margin:0 0 18px}.sub,.muted{color:#63728a}.sub{margin:0}.card{background:white;border:1px solid #e3e9f2;border-radius:18px;padding:22px;box-shadow:0 4px 24px #1732590a;margin-bottom:18px}.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:7px;flex:1;min-width:170px}.field label{font-weight:600;font-size:14px}input{height:44px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;min-width:0;width:100%;background:#fff}input:focus{outline:2px solid #a5c4ff;border-color:#2563eb}.btn{border:0;border-radius:10px;padding:11px 17px;min-height:44px;background:#2563eb;color:#fff;font-weight:600}.btn:hover{background:#1d4ed8}.btn.secondary{background:#edf2fa;color:#24436e}.btn.secondary:hover{background:#dce8f9}.btn.danger{background:#fff0f0;color:#b42318}.btn.danger:hover{background:#ffe2e2}.small{padding:8px 11px;min-height:36px;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{background:white;border:1px solid #e3e9f2;border-radius:15px;padding:16px}.stat strong{display:block;font-size:28px;margin-top:5px}.stat.warning strong{color:#b7660d}.stat.expired strong{color:#b42318}.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:17px}.filters{display:flex;gap:5px;flex-wrap:wrap}.filter{border:0;background:#eef2f7;color:#40516b;border-radius:9px;padding:8px 12px}.filter[aria-pressed="true"]{background:#dbeafe;color:#1d4ed8;font-weight:700}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-top:1px solid #e8edf4}.item:first-child{border-top:0}.name{font-size:17px;font-weight:700;overflow-wrap:anywhere}.details{color:#63728a;font-size:14px;margin-top:6px}.badge{display:inline-block;border-radius:100px;padding:4px 9px;font-size:12px;font-weight:700;background:#e6f5eb;color:#197247;white-space:nowrap}.badge.warning{background:#fff2d8;color:#96510c}.badge.expired{background:#ffebe9;color:#b42318}.item-actions{display:flex;gap:7px;flex-shrink:0}.empty{text-align:center;color:#63728a;padding:32px 10px}.notice{border-radius:10px;padding:12px 14px;background:#eef6ff;color:#214a78;margin-bottom:18px}.notice.error{background:#fff0ee;color:#a52920}.hidden{display:none!important}.mode{font-size:13px;color:#52647e}.auth{display:grid;gap:12px}.auth-actions{display:flex;gap:9px;flex-wrap:wrap}.footer{color:#63728a;font-size:13px;text-align:center;margin-top:18px}dialog{border:0;border-radius:18px;box-shadow:0 18px 60px #16233e44;width:min(440px,calc(100% - 28px));padding:24px}dialog::backdrop{background:#14223888}dialog form{display:grid;gap:14px}dialog h2{margin:0}.dialog-actions{display:flex;justify-content:flex-end;gap:9px}@media(max-width:620px){header{align-items:start;flex-direction:column}.stats{gap:7px}.stat{padding:12px}.stat strong{font-size:23px}.item{align-items:start;flex-direction:column}.item-actions{align-self:flex-end}.card{padding:17px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header><div><h1>💊 药品有效期管理</h1><p class="sub">记录日期，及时查看临期药品</p></div><div id="mode" class="mode"></div></header>
    <div id="notice" class="notice hidden" role="status" aria-live="polite"></div>
    <section id="authPanel" class="card hidden" aria-label="账户登录"><h2>云端账户</h2><form id="authForm" class="auth"><div class="row"><div class="field"><label for="email">邮箱</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div></div><div class="auth-actions"><button class="btn" type="submit">登录</button><button id="registerBtn" class="btn secondary" type="button">注册</button></div><p class="muted" style="margin:0;font-size:13px">注册后如启用了邮箱验证，请先在邮件中完成验证。</p></form><button id="logoutBtn" class="btn secondary hidden" type="button">退出登录</button></section>
    <div id="app">
      <section class="card"><h2>添加药品</h2><form id="drugForm" class="row"><div class="field"><label for="drugName">药品名称</label><input id="drugName" maxlength="120" placeholder="例如：阿莫西林" required></div><div class="field"><label for="drugExpiry">有效期至</label><input id="drugExpiry" type="date" required></div><button id="submitBtn" class="btn" type="submit">添加记录</button></form></section>
      <section class="stats" aria-label="统计"><div class="stat"><span>全部</span><strong id="totalCount">0</strong></div><div class="stat warning"><span>30天内临期</span><strong id="warningCount">0</strong></div><div class="stat expired"><span>已过期</span><strong id="expiredCount">0</strong></div></section>
      <section class="card"><div class="toolbar"><h2 style="margin:0">药品清单</h2><div class="filters" aria-label="筛选记录"><button class="filter" data-filter="all" aria-pressed="true">全部</button><button class="filter" data-filter="warning" aria-pressed="false">临期</button><button class="filter" data-filter="expired" aria-pressed="false">过期</button><button class="filter" data-filter="valid" aria-pressed="false">未临期</button></div></div><div id="drugList" aria-live="polite"></div><div style="text-align:right;margin-top:12px"><button id="clearBtn" class="btn danger small" type="button">清空全部记录</button></div></section>
      <p class="footer">今天：<span id="today"></span> · 日期以设备本地时区计算 · 提醒在打开页面时更新</p>
    </div>
  </main>
  <dialog id="editDialog"><form id="editForm"><h2>编辑药品</h2><div class="field"><label for="editName">药品名称</label><input id="editName" maxlength="120" required></div><div class="field"><label for="editExpiry">有效期至</label><input id="editExpiry" type="date" required></div><div class="dialog-actions"><button id="cancelEdit" class="btn secondary" type="button">取消</button><button class="btn" type="submit">保存</button></div></form></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>

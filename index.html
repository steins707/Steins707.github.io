<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>药品有效期管理</title>
  <style>
    /* 样式部分保持你原来的即可，这里省略 */
  </style>
</head>
<body>

  <!-- 你的页面结构 ... -->

  <script type="module">
    /* ============================================================
       1. Supabase 配置（ESM 方式）
       ============================================================ */
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://vnvvywclbwdywbtwmvei.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_C_S2ZBL_QFtv_ir9YmrQeg_UjHB3PO4';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ============================================================
       2. 药品管理逻辑
       ============================================================ */
    const STORAGE_KEY = 'med_expiry_manager_v1';
    let drugs = [];
    let currentFilter = 'all';

    const drugNameInput = document.getElementById('drugNameInput');
    const drugExpiryInput = document.getElementById('drugExpiryInput');
    const addBtn = document.getElementById('addBtn');
    const drugListContainer = document.getElementById('drugListContainer');
    const totalCountSpan = document.getElementById('totalCount');
    const warningCountSpan = document.getElementById('warningCount');
    const expiredCountSpan = document.getElementById('expiredCount');
    const todayDisplay = document.getElementById('todayDisplay');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const filterButtons = document.querySelectorAll('.filter-btn');

    /* ---------- 工具函数 ---------- */
    function formatDate(isoDate) {
      if (!isoDate) return '未知';
      const [y, m, d] = isoDate.split('-');
      return `${y}年${parseInt(m, 10)}月${parseInt(d, 10)}日`;
    }

    function getTodayISO() {
      const today = new Date();
      const y = today.getFullYear();
      const m = String(today.getMonth() + 1).padStart(2, '0');
      const d = String(today.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function daysBetween(todayISO, expiryISO) {
      if (!expiryISO) return NaN;
      const [ty, tm, td] = todayISO.split('-').map(Number);
      const [ey, em, ed] = expiryISO.split('-').map(Number);
      const todayUTC = Date.UTC(ty, tm - 1, td);
      const expiryUTC = Date.UTC(ey, em - 1, ed);
      return Math.floor((expiryUTC - todayUTC) / (1000 * 60 * 60 * 24));
    }

    function getDrugStatus(expiryISO) {
      if (!expiryISO) return 'unknown';
      const today = getTodayISO();
      const diff = daysBetween(today, expiryISO);
      if (diff < 0) return 'expired';
      if (diff <= 30) return 'warning';
      return 'valid';
    }

    function filterDrugs(drugList) {
      if (currentFilter === 'all') return drugList;
      return drugList.filter(drug => getDrugStatus(drug.expiry) === currentFilter);
    }

    function updateStats() {
      let warning = 0, expired = 0;
      drugs.forEach(drug => {
        const status = getDrugStatus(drug.expiry);
        if (status === 'warning') warning++;
        if (status === 'expired') expired++;
      });
      totalCountSpan.textContent = drugs.length;
      warningCountSpan.textContent = warning;
      expiredCountSpan.textContent = expired;
    }

    /* ---------- Supabase 数据操作 ---------- */
    // 从 Supabase 加载数据
    async function loadFromSupabase() {
      const { data, error } = await supabase
        .from('drugs')
        .select('*')
        .order('expiry', { ascending: true });

      if (error) {
        console.error('加载失败：', error.message);
        // 加载失败时退回本地数据
        loadFromLocal();
        return;
      }

      drugs = data || [];
      render();
    }

    // 本地兜底（可选）
    function loadFromLocal() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        drugs = stored ? JSON.parse(stored) : [];
      } catch (e) {
        drugs = [];
      }
      render();
    }

    // 添加药品到 Supabase
    async function addDrugToSupabase(name, expiry) {
      const { data, error } = await supabase
        .from('drugs')
        .insert([{ name, expiry }])
        .select();

      if (error) {
        alert('添加失败：' + error.message);
        return null;
      }
      return data[0];
    }

    // 从 Supabase 删除
    async function deleteDrugFromSupabase(id) {
      const { error } = await supabase
        .from('drugs')
        .delete()
        .eq('id', id);

      if (error) {
        alert('删除失败：' + error.message);
        return false;
      }
      return true;
    }

    // 更新 Supabase 中的药品
    async function updateDrugInSupabase(id, name, expiry) {
      const { error } = await supabase
        .from('drugs')
        .update({ name, expiry })
        .eq('id', id);

      if (error) {
        alert('更新失败：' + error.message);
        return false;
      }
      return true;
    }

    // 清空 Supabase
    async function clearAllInSupabase() {
      const { error } = await supabase
        .from('drugs')
        .delete()
        .neq('id', 0);   // 删除所有（id 不等于 0 等价于全部）

      if (error) {
        alert('清空失败：' + error.message);
        return false;
      }
      return true;
    }

    /* ---------- 渲染 ---------- */
    function render() {
      const filtered = filterDrugs(drugs);
      const todayISO = getTodayISO();
      drugListContainer.innerHTML = '';

      if (filtered.length === 0) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'empty';
        emptyDiv.innerHTML = drugs.length === 0
          ? '📭 还没有药品记录<br><span style="font-size:13px;">点击上方添加</span>'
          : '🔍 没有符合当前筛选条件的药品';
        drugListContainer.appendChild(emptyDiv);
      } else {
        const statusOrder = { expired: 0, warning: 1, valid: 2, unknown: 3 };
        filtered.sort((a, b) => {
          const sa = getDrugStatus(a.expiry);
          const sb = getDrugStatus(b.expiry);
          if (statusOrder[sa] !== statusOrder[sb]) return statusOrder[sa] - statusOrder[sb];
          return (a.expiry || '').localeCompare(b.expiry || '');
        });

        filtered.forEach(drug => {
          const status = getDrugStatus(drug.expiry);
          const diffDays = drug.expiry ? daysBetween(todayISO, drug.expiry) : NaN;

          const item = document.createElement('div');
          item.className = 'drug-item';

          const infoDiv = document.createElement('div');
          infoDiv.className = 'drug-info';

          const nameDiv = document.createElement('div');
          nameDiv.className = 'drug-name';
          nameDiv.textContent = drug.name;

          const badge = document.createElement('span');
          badge.className = 'badge';
          if (status === 'expired') {
            badge.classList.add('danger');
            badge.textContent = '已过期';
          } else if (status === 'warning') {
            badge.classList.add('warning');
            badge.textContent = `临期 ${diffDays}天`;
          } else if (status === 'valid') {
            badge.textContent = `剩余${diffDays}天`;
          } else {
            badge.textContent = '无期限';
          }
          nameDiv.appendChild(badge);

          const expiryDiv = document.createElement('div');
          expiryDiv.className = 'expiry';
          expiryDiv.innerHTML = `📅 有效期至 <strong>${formatDate(drug.expiry)}</strong>`;

          infoDiv.appendChild(nameDiv);
          infoDiv.appendChild(expiryDiv);

          const actionsDiv = document.createElement('div');
          actionsDiv.className = 'actions';

          const editBtn = document.createElement('button');
          editBtn.className = 'icon-btn';
          editBtn.innerHTML = '✏️ 编辑';
          editBtn.addEventListener('click', () => editDrug(drug.id));

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'icon-btn delete';
          deleteBtn.innerHTML = '🗑️ 删除';
          deleteBtn.addEventListener('click', () => deleteDrug(drug.id));

          actionsDiv.appendChild(editBtn);
          actionsDiv.appendChild(deleteBtn);

          item.appendChild(infoDiv);
          item.appendChild(actionsDiv);
          drugListContainer.appendChild(item);
        });
      }

      updateStats();

      const today = new Date();
      todayDisplay.textContent =
        `${today.getFullYear()}.${String(today.getMonth() + 1).padStart(2, '0')}.${String(today.getDate()).padStart(2, '0')}`;
    }

    /* ---------- 操作函数 ---------- */
    async function addDrug() {
      const name = drugNameInput.value.trim();
      const expiry = drugExpiryInput.value;

      if (!name) { alert('请输入药品名称'); drugNameInput.focus(); return; }
      if (!expiry) { alert('请选择有效期'); drugExpiryInput.focus(); return; }

      const newDrug = await addDrugToSupabase(name, expiry);
      if (newDrug) {
        drugs.push(newDrug);
        drugNameInput.value = '';
        drugExpiryInput.value = '';
        drugNameInput.focus();
        render();
      }
    }

    async function deleteDrug(id) {
      if (!confirm('确定要删除这条药品记录吗？')) return;
      const ok = await deleteDrugFromSupabase(id);
      if (ok) {
        drugs = drugs.filter(d => d.id !== id);
        render();
      }
    }

    async function editDrug(id) {
      const drug = drugs.find(d => d.id === id);
      if (!drug) return;

      const newName = prompt('修改药品名称', drug.name);
      if (newName === null) return;
      const trimmedName = newName.trim();
      if (!trimmedName) { alert('药品名称不能为空'); return; }

      const newExpiry = prompt('修改有效期 (格式 YYYY-MM-DD)', drug.expiry);
      if (newExpiry === null) return;
      const dateRegex = /^\d{4}-\d{2}-\d{2}$/;
      if (!dateRegex.test(newExpiry)) { alert('请输入正确的日期格式，如 2025-12-31'); return; }
      const [y, m, d] = newExpiry.split('-').map(Number);
      const dateObj = new Date(y, m - 1, d);
      if (dateObj.getFullYear() !== y || dateObj.getMonth() + 1 !== m || dateObj.getDate() !== d) {
        alert('日期无效，请重新输入');
        return;
      }

      const ok = await updateDrugInSupabase(id, trimmedName, newExpiry);
      if (ok) {
        drug.name = trimmedName;
        drug.expiry = newExpiry;
        render();
      }
    }

    async function clearAll() {
      if (drugs.length === 0) return;
      if (!confirm('⚠️ 确定要清空所有药品记录吗？此操作不可恢复。')) return;
      const ok = await clearAllInSupabase();
      if (ok) {
        drugs = [];
        render();
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      filterButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      render();
    }

    /* ---------- 初始化 ---------- */
    function init() {
      // 默认有效期一个月后
      const defaultExpiry = new Date();
      defaultExpiry.setMonth(defaultExpiry.getMonth() + 1);
      const y = defaultExpiry.getFullYear();
      const m = String(defaultExpiry.getMonth() + 1).padStart(2, '0');
      const d = String(defaultExpiry.getDate()).padStart(2, '0');
      drugExpiryInput.value = `${y}-${m}-${d}`;

      addBtn.addEventListener('click', addDrug);
      drugNameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); addDrug(); }
      });
      clearAllBtn.addEventListener('click', clearAll);
      filterButtons.forEach(btn => {
        btn.addEventListener('click', () => setFilter(btn.dataset.filter));
      });

      // 从 Supabase 加载
      loadFromSupabase();
    }

    init();
  </script>
</body>
</html>
